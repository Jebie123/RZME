body.dark{--bg:#111827;--c:#1f2937;--t:#f3f4f6;--m:#9ca3af;--b:#374151}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,Arial,sans-serif;background:var(--bg);color:var(--t)}
h2,h3{margin:8px 0}[hidden]{display:none!important}
/* sidebar + layout */
.side{position:fixed;top:0;bottom:0;left:0;width:230px;background:var(--c);border-right:1px solid var(--b);padding:12px;overflow:hidden;transition:.2s;z-index:5}
.side a{display:flex;gap:12px;padding:11px;margin-bottom:4px;border-radius:8px;color:var(--t);text-decoration:none;cursor:pointer;white-space:nowrap;transition:.15s}
.side a:hover,.side a.on{background:var(--p);color:#fff}
main{margin-left:230px;transition:.2s}
.col .side{width:64px}.col main{margin-left:64px}.col .side span{display:none}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:4}
.pad{padding:20px}
.pub .side,.pub .top,.lock .side,.lock .top{display:none}.pub main,.lock main{margin-left:0!important}
/* School branding and school-photo backgrounds */
.seal{display:inline-block;width:45px;height:45px;flex-shrink:0;border-radius:50%;background:#fff var(--school-seal) center/contain no-repeat;box-shadow:0 0 0 2px #ffffff70}
.seal.lg{width:106px;height:106px;border:3px solid #fff;box-shadow:0 6px 24px #082b5330}

/* cards, grids, forms, buttons */
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;transition:.15s}
.card:hover{box-shadow:0 4px 12px #0001}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat small,.m{color:var(--m)}.stat b{display:block;font-size:30px;color:var(--p)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.w{grid-column:1/-1}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.bar input,.bar select{width:auto;flex:1;min-width:140px}
.act{display:flex;gap:6px;flex-wrap:wrap}
label{display:block;font-size:13px;color:var(--m)}
input,select{width:100%;padding:8px;margin-top:4px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit}
input[type=checkbox]{width:auto}
.btn{background:var(--p);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;transition:.15s}
.btn:hover{opacity:.85}.btn.s{background:var(--b);color:var(--t)}.btn.r{background:#dc2626}.btn.gn{background:#16a34a}
/* tables, badges, modal */
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:9px;text-align:left;border-bottom:1px solid var(--b)}
tr:hover td{background:var(--bg)}td input.gi{width:72px;margin:0}
.bd{padding:2px 9px;border-radius:99px;font-size:12px}
.Pending{background:#fef3c7;color:#92400e}.Enrolled{background:#dcfce7;color:#166534}.Rejected{background:#fee2e2;color:#991b1b}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9}.modal.on{display:flex}
.box{background:var(--c);padding:20px;border-radius:12px;width:min(600px,94vw);max-height:90vh;overflow:auto}
/* public enrollment form */
.wrap{max-width:720px;margin:20px auto}
.prog{height:6px;background:var(--b);border-radius:9px;margin:10px 0 16px}.prog i{display:block;height:100%;background:var(--p);border-radius:9px;transition:.3s}
.step{display:none}.step.on{display:grid}
@media(max-width:900px){.two{grid-template-columns:1fr}}

/* Warm editorial dashboard inspired by the supplied reference */

<body>
<nav class="side" id="nav"></nav>
<main>
  <header class="top">
    <div class="top-school"><span class="seal sm" role="img" aria-label="School logo"></span><b id="sn">School</b></div><span style="flex:1"></span>
    <button class="btn s" id="dm" title="Light / dark mode">🌓</button>
    <button class="btn s" id="lo" title="Log out">Log out</button>
  </header>
  <section id="view" class="pad"></section>
</main>
<div class="modal" id="md"><div class="box" id="bx"></div></div>

<script>
/* Student Enrollment Management System - one file.
   Admin pages: index.html   |   Public enrollment form: index.html#enroll */
const $=i=>document.getElementById(i),DB='medinaES',PUB=location.hash=='#enroll';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let S={k:'cfg',school:'Restituta Z. Medina Elementary School',year:'2026-2027',grades:'Kindergarten, Grade 1, Grade 2, Grade 3, Grade 4, Grade 5, Grade 6',dark:false,auto:true,user:'jebie@gmail.com',pw:'',credentialsVersion:3,nextDemoAt:0,approvalBatch:0,reportsHistory:[],lastReportAt:0},
    ST=[],GD=[],cur='dashboard',AR=null,_d;   // settings, students, grades, current page, open grade record

/* ---------- IndexedDB (stores: students, grades, settings) ---------- */
const open_=()=>_d||(_d=new Promise((ok,no)=>{const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('students',{keyPath:'id'});d.createObjectStore('grades',{keyPath:'key'});d.createObjectStore('settings',{keyPath:'k'})};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
const tx=async(s,m,fn)=>{if(MEM)return fn(memStore(s)).result;const d=await open_();return new Promise((ok,no)=>{const t=d.transaction(s,m),q=fn(t.objectStore(s));t.oncomplete=()=>ok(q.result);t.onerror=()=>no(t.error)})};
const all=s=>tx(s,'readonly',o=>o.getAll()),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),
      del=(s,k)=>tx(s,'readwrite',o=>o.delete(k)),clr=s=>tx(s,'readwrite',o=>o.clear());
const refresh=async()=>{ST=await all('students');GD=await all('grades')};
let MEM=null;   // in-memory fallback if the browser blocks IndexedDB
const kp={students:'id',grades:'key',settings:'k'},memStore=s=>({getAll:()=>({result:Object.values(MEM[s])}),put:v=>({result:MEM[s][v[kp[s]]]=v}),delete:k=>({result:delete MEM[s][k]}),clear:()=>({result:MEM[s]={}})});

/* ---------- helpers ---------- */
const grades=()=>S.grades.split(',').map(x=>x.trim()).filter(Boolean);
const age=b=>{if(!b)return'';const n=new Date(),d=new Date(b);let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a};
const nm=s=>esc(`${s.ln}, ${s.fn} ${s.mn||''}`.trim());
const opts=(a,v)=>a.map(x=>`<option${x==v?' selected':''}>${esc(x)}</option>`).join('');
const badge=s=>`<span class="bd ${s}">${s}</span>`;
const nextId=()=>'STU-'+new Date().getFullYear()+'-'+String(ST.reduce((m,s)=>Math.max(m,+s.id.slice(-4)||0),0)+1).padStart(4,'0');
const table=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}">No records found.</td></tr>`}</table></div>`;
const show=h=>{$('view').innerHTML=h},modal=h=>{$('bx').innerHTML=h;$('md').classList.add('on')},closeM=()=>$('md').classList.remove('on');
const apply=()=>{document.body.classList.toggle('dark',S.dark);$('sn').textContent=S.school};
const inp=(n,l,v,x='',t='text')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`,
      sel=(n,l,o,v)=>`<label>${l}<select name="${n}">${opts(o,v)}</select></label>`;

/* ---------- demo data (first run only) ---------- */
const SEED=[['Juan','Santos','Dela Cruz','2019-03-14','Male','Grade 1','Maria Dela Cruz','Enrolled'],
['Ana','Reyes','Garcia','2017-07-02','Female','Grade 3','Jose Garcia','Enrolled'],
['Mark','Lopez','Villanueva','2015-11-20','Male','Grade 5','Liza Villanueva','Enrolled'],
['Sofia','Cruz','Ramos','2014-01-09','Female','Grade 6','Rene Ramos','Enrolled'],
['Paolo','Diaz','Mendoza','2020-05-30','Male','Kindergarten','Carla Mendoza','Pending'],
['Bea','Torres','Aquino','2018-09-12','Female','Grade 2','Ben Aquino','Pending'],
['Carlo','Perez','Navarro','2016-02-25','Male','Grade 4','Nina Navarro','Pending'],
['Lea','Bautista','Flores','2019-08-18','Female','Grade 1','Tess Flores','Rejected']];
const seed=()=>Promise.all(SEED.map((r,i)=>put('students',{id:'STU-2026-'+String(i+1).padStart(4,'0'),lrn:String(105226000101+i),
  fn:r[0],mn:r[1],ln:r[2],bd:r[3],sex:r[4],addr:'Brgy. Poblacion',grade:r[5],year:S.year,guardian:r[6],
  contact:'09171234'+(500+i),status:r[7],ref:i>3?'ENR-2026-'+(1001+i):'',created:Date.now()-i*864e5})));

/* ---------- navigation ---------- */
const PG={dashboard:['📊','Dashboard'],students:['🎓','Students'],apps:['📝','Enrollment Applications'],pending:['📋','Pending Students'],grades:['📚','Academic Records'],form:['🧾','Enrollment Form'],reports:['📈','Reports'],codes:['🔐','Code Generator'],settings:['⚙️','Settings']};
const R={};
function go(p){if(!enforceAccess())return;cur=p;document.querySelectorAll('#nav a[data-p]').forEach(a=>a.classList.toggle('on',a.dataset.p==p));R[p]()}


/* ---------- 30-second code typing challenge ---------- */
const CODEKEY='rzm-generated-codes-v1',CODEWINDOW=5*60*60*1000,CODELIMIT=5,CHALLENGE_MS=30000;
let currentChallenge=null,challengeTicker=null;
function codeHistory(){try{const a=JSON.parse(localStorage.getItem(CODEKEY));return Array.isArray(a)?a:[]}catch(e){return []}}
function codeSave(a){localStorage.setItem(CODEKEY,JSON.stringify(a))}
function codeUsed(id,now=Date.now()){return codeHistory().filter(x=>x.userId===id&&x.created>now-CODEWINDOW)}
function codeRandom(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',bytes=new Uint8Array(9);crypto.getRandomValues(bytes);return Array.from(bytes,n=>chars[n%chars.length]).join('').replace(/^(.{3})(.{3})(.{3})$/,'$1-$2-$3')}
function refreshChallenge(userId){let code;do{code=codeRandom()}while(codeHistory().some(x=>x.code===code));currentChallenge={userId,code,expires:Date.now()+CHALLENGE_MS}}
function updateChallengeClock(){
 if(cur!=='codes'||!$('challengeClock')){clearInterval(challengeTicker);challengeTicker=null;return}
 const u=currentUser();if(!u)return;
 if(!currentChallenge||currentChallenge.userId!==u.id||Date.now()>=currentChallenge.expires){refreshChallenge(u.id);if($('challengeInput'))$('challengeInput').value='';if($('challengeError'))$('challengeError').textContent='Previous code expired. Type the new code.'}
 $('challengeCode').textContent=currentChallenge.code;
 const seconds=Math.max(0,Math.ceil((currentChallenge.expires-Date.now())/1000));$('challengeClock').textContent=seconds+'s';
 $('challengeProgress').style.width=(seconds/30*100)+'%';
}
function submitChallenge(){
 const u=currentUser();if(!u)return;const error=$('challengeError'),input=$('challengeInput');if(!error||!input)return;
 if(codeUsed(u.id).length>=CODELIMIT){error.textContent='Typing is available, but you have reached 5 successful codes in the last 5 hours. New completions can be recorded when a slot opens.';return}
 if(!currentChallenge||currentChallenge.userId!==u.id||Date.now()>=currentChallenge.expires){refreshChallenge(u.id);updateChallengeClock();error.textContent='Time expired. A new code is shown; please type it.';return}
 const typed=input.value.trim().toUpperCase();if(typed!==currentChallenge.code){error.textContent='Incorrect code. Type the code displayed above before the timer ends.';return}
 const all=codeHistory();all.unshift({code:currentChallenge.code,userId:u.id,userName:u.label,created:Date.now(),source:'typing-challenge'});
 try{codeSave(all);currentChallenge=null;R.codes();const msg=$('challengeError');if(msg){msg.style.color='#16835d';msg.textContent='Correct! Your completed code has been recorded.'}}catch(e){error.textContent='Unable to save your result.'}
}
R.codes=()=>{
 const u=currentUser();if(!u)return;const now=Date.now(),all=codeHistory(),mine=all.filter(x=>x.userId===u.id),recent=codeUsed(u.id,now),remaining=CODELIMIT-recent.length;
 const next=recent.length>=CODELIMIT?new Date(Math.min(...recent.map(x=>x.created))+CODEWINDOW).toLocaleString():'Available now';
 const people=getUsers().map(x=>({name:x.label,id:x.id,count:all.filter(c=>c.userId===x.id).length,window:codeUsed(x.id,now).length}));const maximum=Math.max(1,...people.map(x=>x.count));
 if(!currentChallenge||currentChallenge.userId!==u.id||now>=currentChallenge.expires)refreshChallenge(u.id);
 show(`<div class="rz-dashboard"><div class="rz-heading"><div><span class="rz-eyebrow">MANAGEMENT TOOLS / CODE CHALLENGE</span><h1>Code Typing<span class="rz-dot">.</span></h1><p>Type the displayed code before the 30-second timer expires.</p></div></div>
 <div class="rz-stats"><div class="rz-metric"><small>Successful codes remaining</small><strong>${remaining} / ${CODELIMIT}</strong><span class="rz-muted">Rolling 5-hour limit per manager</span></div><div class="rz-metric"><small>My completed codes</small><strong>${mine.length}</strong></div><div class="rz-metric"><small>Next available slot</small><b style="font-size:15px">${esc(next)}</b></div><div class="rz-metric"><small>All users completed</small><strong>${all.length}</strong></div></div>
 <div class="rz-feature-grid"><section class="rz-panel"><div class="rz-section-head"><div><span class="rz-eyebrow">30-SECOND CHALLENGE</span><h3>Read and type this code</h3></div><span class="rz-pill" id="challengeClock">30s</span></div>
 <div class="rz-challenge-display" id="challengeCode">${esc(currentChallenge.code)}</div><div class="rz-timer-track"><i id="challengeProgress"></i></div>
 <p class="m">A new random code appears automatically every 30 seconds. Expired codes cannot be submitted.</p><label for="challengeInput"><b>Type the code shown above</b></label><div class="bar"><input id="challengeInput" maxlength="11" placeholder="ABC-123-XYZ" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Type the displayed code"><button class="btn" id="submitChallenge">Check Code</button></div><p id="challengeError" role="status" style="color:#dc2626;font-size:12px"></p>
 <div class="rz-code-list">${mine.slice(0,6).map(x=>`<div class="rz-code-entry"><code>${esc(x.code)}</code><small>${new Date(x.created).toLocaleString()}</small><span class="rz-user-status is-online">✓ Correct</span></div>`).join('')||'<p class="m">No successful entries yet.</p>'}</div></section>
 <section class="rz-panel"><div class="rz-section-head"><div><span class="rz-eyebrow">USER PERFORMANCE</span><h3>Correct codes by manager</h3></div></div><div class="rz-grades">${people.map(x=>`<div class="rz-grade rz-code-grade"><span title="${esc(x.id)}">${esc(x.name)}</span><div class="rz-track"><i style="width:${x.count/maximum*100}%"></i></div><b>${x.count}</b></div>`).join('')}</div><p class="m">Chart counts correctly typed codes, not codes merely displayed.</p></section></div>
 <section class="rz-panel"><div class="rz-section-head"><div><span class="rz-eyebrow">PERFORMANCE HISTORY</span><h3>Manager activity</h3></div></div>${table(['Manager','User ID','Correct in last 5 hours','Total correct'],people.map(x=>[esc(x.name),esc(x.id),x.window+' / 5',String(x.count)]))}</section>
 <p class="rz-note">Demo-only typing activity. Results and limits are stored in this browser, not synchronized across devices.</p></div>`);
 $('submitChallenge').onclick=submitChallenge;
 const typing=$('challengeInput');
 // Allow normal typing and editing, but block clipboard insertion and drag/drop.
 ['paste','drop','beforepaste'].forEach(eventName=>typing.addEventListener(eventName,e=>{e.preventDefault();$('challengeError').textContent='Copy and paste is disabled. Please type the code manually.'}));
 typing.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitChallenge();return}if((e.ctrlKey||e.metaKey)&&['v','V','Insert'].includes(e.key)){e.preventDefault();$('challengeError').textContent='Please type the code manually.'}});
 typing.addEventListener('input',()=>{typing.value=typing.value.toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,11)});
 typing.addEventListener('contextmenu',e=>e.preventDefault());

 clearInterval(challengeTicker);updateChallengeClock();challengeTicker=setInterval(updateChallengeClock,250);
};

/* ---------- dashboard ---------- */
const cnt=t=>ST.filter(s=>s.status==t).length,approved=()=>ST.filter(s=>s.ref&&s.status=='Enrolled').length;
R.dashboard=()=>{
 const users=getUsers(),active=users.filter(u=>online(u.id)),pending=ST.filter(s=>s.status==='Pending');
 const recent=ST.filter(s=>s.ref).sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,6);
 const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(6-i));return {label:d.toLocaleDateString('en',{weekday:'short'}),count:ST.filter(x=>{const t=new Date(x.created||0);return t.toDateString()===d.toDateString()}).length}});
 const max=Math.max(1,...days.map(d=>d.count));
 const coords=days.map((d,i)=>`${35+i*75},${165-(d.count/max)*125}`).join(' ');
 const dots=days.map((d,i)=>`<circle cx="${35+i*75}" cy="${165-(d.count/max)*125}" r="5" fill="#f2a93b"><title>${d.label}: ${d.count} applications</title></circle><text x="${35+i*75}" y="192" text-anchor="middle" font-size="12" fill="#77838c">${d.label}</text>`).join('');
 const metrics=[['Total Students',ST.length,'👥'],['Enrolled',cnt('Enrolled'),'🎓'],['Pending',cnt('Pending'),'🕒'],['Rejected',cnt('Rejected'),'📋']];
 show(`<div class="rz-dashboard">
  <div class="rz-heading"><div><span class="rz-eyebrow">SCHOOL MANAGEMENT / OVERVIEW</span><h1>Dashboard<span class="rz-dot">.</span></h1><p>Welcome back, ${esc(currentUser()?.label||'Manager')} · ${esc(S.year)}</p></div><div class="rz-heading-actions"><span class="rz-live"><i></i> ${active.length} active manager${active.length===1?'':'s'}</span><button class="btn s" onclick="R.dashboard()">↻ Refresh</button></div></div>
  <div class="rz-stats">${metrics.map(([name,value,icon])=>`<div class="rz-metric"><span class="rz-metric-icon">${icon}</span><small>${name}</small><strong>${value}</strong><span class="rz-muted">Current school records</span></div>`).join('')}</div>
  <div class="rz-feature-grid"><section class="rz-panel rz-activity"><div class="rz-section-head"><div><span class="rz-eyebrow">ENROLLMENT ACTIVITY</span><h3>Weekly applications</h3></div><span class="rz-pill">Last 7 days</span></div><svg viewBox="0 0 520 205" width="100%" role="img" aria-label="Number of enrollment applications during the last seven days"><line x1="25" y1="165" x2="500" y2="165" stroke="#e4e8e7"/><line x1="25" y1="102" x2="500" y2="102" stroke="#e4e8e7" stroke-dasharray="4 6"/><line x1="25" y1="40" x2="500" y2="40" stroke="#e4e8e7" stroke-dasharray="4 6"/><polyline points="${coords}" fill="none" stroke="#f2a93b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg><div class="rz-activity-foot"><span><b>${pending.length}</b> awaiting review</span><button class="btn" onclick="go('pending')">Review Pending →</button></div></section>
  <section class="rz-panel"><div class="rz-section-head"><div><span class="rz-eyebrow">TEAM PRESENCE</span><h3>Management users</h3></div><span class="rz-pill">${active.length} online</span></div><div class="rz-team">${users.map((u,i)=>`<div class="rz-person"><span class="rz-avatar" style="background:${['#e9d9c7','#d7e9e3','#e4e0f2','#f4e0d5'][i%4]}">${esc((u.label||u.email||'?').slice(0,1).toUpperCase())}</span><span class="rz-person-name"><b>${esc(u.label||u.email)}</b><small>${esc(u.id)}</small></span><span class="rz-user-status ${online(u.id)?'is-online':''}">${online(u.id)?'● Active':'○ Offline'}</span></div>`).join('')||'<p class="rz-muted">No manager accounts found.</p>'}</div><p class="rz-presence-note">Active status reflects activity in this browser only.</p></section></div>
  <div class="rz-bottom-grid"><section class="rz-panel"><div class="rz-section-head"><div><span class="rz-eyebrow">LATEST SUBMISSIONS</span><h3>Recent applications</h3></div><button class="btn s" onclick="go('apps')">View all →</button></div>${table(['Student','Grade','Status'],recent.map(x=>[nm(x),esc(x.grade||'-'),badge(x.status)]))}</section>
  <section class="rz-panel"><div class="rz-section-head"><div><span class="rz-eyebrow">GRADE DISTRIBUTION</span><h3>Students by grade</h3></div></div><div class="rz-grades">${grades().map(g=>{const n=ST.filter(x=>x.grade===g).length;return `<div class="rz-grade"><span>${esc(g)}</span><div class="rz-track"><i style="width:${Math.round(n/Math.max(ST.length,1)*100)}%"></i></div><b>${n}</b></div>`}).join('')}</div></section></div>
  <div class="rz-note">Demo enrollment applications are simulated. All records and user presence are local to this browser, not synchronized between devices.</div>
 </div>`);
};

/* ---------- students ---------- */
const acts=(id,app)=>`<span class="act"><button class="btn s" onclick="vw('${id}')">View</button><button class="btn s" onclick="edit('${id}')">Edit</button>`+
  (app?`<button class="btn gn" onclick="setS('${id}','Enrolled')">Approve</button><button class="btn r" onclick="setS('${id}','Rejected')">Reject</button>`:`<button class="btn r" onclick="rm('${id}')">Delete</button>`)+'</span>';
const match=(s,q)=>!q||(s.id+s.lrn+s.fn+s.mn+s.ln+(s.ref||'')).toLowerCase().includes(q.toLowerCase());
R.students=()=>{
  show(`<h2>Students</h2><div class="bar"><input id="q" placeholder="Search name, LRN or ID"><select id="fg"><option value="">All grades</option>${opts(grades())}</select>
  <select id="fs"><option value="">All status</option>${opts(['Enrolled','Pending','Rejected'])}</select><button class="btn" onclick="edit()">+ Add Student</button></div><div class="card" id="tb"></div>`);
  ['q','fg','fs'].forEach(i=>$(i).oninput=drawS);drawS()};
function drawS(){
  const L=ST.filter(s=>match(s,$('q').value)&&(!$('fg').value||s.grade==$('fg').value)&&(!$('fs').value||s.status==$('fs').value));
  $('tb').innerHTML=table(['ID','LRN','Name','Age','Grade','Status','Actions'],L.map(s=>[s.id,esc(s.lrn),nm(s),age(s.bd),esc(s.grade),badge(s.status),acts(s.id)]))}

function edit(id){   // add (no id) or edit a student
  const s=ST.find(x=>x.id==id)||{id:nextId(),status:'Enrolled',year:S.year},today=new Date().toISOString().slice(0,10);
  modal(`<h3>${id?'Edit':'Add'} Student</h3><form id="sf" class="g">${inp('id','Student ID (automatic)',s.id,'readonly')}${inp('lrn','LRN (12 digits)',s.lrn||'','required pattern="\\d{12}"')}
  ${inp('fn','First Name',s.fn||'','required')}${inp('mn','Middle Name',s.mn||'')}${inp('ln','Last Name',s.ln||'','required')}
  ${inp('bd','Birthdate',s.bd||'','required max="'+today+'" oninput="$(\'ag\').value=age(this.value)"','date')}
  <label>Age (automatic)<input id="ag" value="${age(s.bd)}" readonly></label>${sel('sex','Sex',['Male','Female'],s.sex)}
  ${inp('addr','Address',s.addr||'','required')}${sel('grade','Grade Level',grades(),s.grade)}${inp('year','School Year',s.year,'required')}
  ${inp('guardian','Parent/Guardian Name',s.guardian||'','required')}${inp('contact','Contact Number (09XXXXXXXXX)',s.contact||'','required pattern="09\\d{9}"')}
  ${sel('status','Enrollment Status',['Enrolled','Pending','Rejected'],s.status)}
  <div class="w act"><button class="btn">Save</button><button type="button" class="btn s" onclick="closeM()">Cancel</button></div></form>`);
  $('sf').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
    if(ST.some(x=>x.lrn==d.lrn&&x.id!=d.id))return alert('This LRN already exists.');
    await put('students',{created:Date.now(),...s,...d});await refresh();closeM();R[cur]()}}

function vw(id){   // view student / application details
  const s=ST.find(x=>x.id==id),L=[['Student ID',s.id],['Reference No.',s.ref||'-'],['LRN',esc(s.lrn)],['Name',nm(s)],['Birthdate / Age',s.bd+' / '+age(s.bd)],['Sex',s.sex],

async function backup(){
  const t=JSON.stringify({students:await all('students'),grades:await all('grades'),settings:{...S,user:undefined,pw:undefined}}),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='enrollment-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function restore(f){
  if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.students))throw 0;
    if(!confirm('Replace ALL current data with this backup?'))return;
    await clr('students');await clr('grades');for(const s of d.students)await put('students',s);for(const g of d.grades||[])await put('grades',g);
    if(d.settings){S={...S,...d.settings};await put('settings',S)}
    await refresh();apply();go('dashboard');alert('Backup restored.')}catch(e){alert('That file is not a valid backup.')}};
  r.readAsText(f)}

/* ---------- account management and local renewal requests ---------- */
const ACCKEY='rzm-account-access-v1',SESSIONKEY='rzm-current-account-v1',USERSKEY='rzm-users-v2',PAYKEY='rzm-renewals-v1',PRESKEY='rzm-presence-v1';
const defaults=[{id:'RZM-0001',email:'jebie@gmail.com',password:'pass@123',label:'Primary Manager',legacy:'jebie'},{id:'RZM-0002',email:'http://ursabiadave0gmail.com',password:'Dave@123',label:'Second Manager',legacy:'dave'}];
let AUTH=false,activeAccount=null,tabToken=Math.random().toString(36).slice(2);
function getUsers(){try{const u=JSON.parse(localStorage.getItem(USERSKEY));return Array.isArray(u)?u:defaults.map(x=>({...x}))}catch(e){return defaults.map(x=>({...x}))}}
function saveUsers(u){localStorage.setItem(USERSKEY,JSON.stringify(u))}
function accessState(){try{return JSON.parse(localStorage.getItem(ACCKEY))||{}}catch(e){return {}}}
function enabled(id){const a=getUsers().find(x=>x.id===id);if(!a)return false;const state=accessState();return state[id]!==false&&(!a?.legacy||state[a.legacy]!==false)&&(!a?.expiresAt||Date.now()<a.expiresAt)}
function setEnabled(id,value){const x=accessState();x[id]=value;const a=getUsers().find(x=>x.id===id);if(a?.legacy)delete x[a.legacy];localStorage.setItem(ACCKEY,JSON.stringify(x))}
function getRequests(){try{return JSON.parse(localStorage.getItem(PAYKEY))||[]}catch(e){return []}}

function hs(s){let a=0xdeadbeef,b=0x41c6ce57;for(const c of 'medina|'+s){const k=c.charCodeAt(0);a=Math.imul(a^k,2654435761);b=Math.imul(b^k,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}

  $('lo').onclick=()=>{setAccount(null);location.reload()};
  isAuth()?start():(setAccount(null),welcomeScreen())})();
</script>
